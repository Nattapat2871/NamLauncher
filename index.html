<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* ws://localhost:* https://launchermeta.mojang.com https://meta.fabricmc.net https://files.minecraftforge.net; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:;"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="./namlauncher-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NamLauncher</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #09101f;
      }

      .nam-initial-splash {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(59, 130, 246, 0.08), transparent 32%),
          #09101f;
        color: #e5eefc;
        font-family: 'Noto Sans Thai', 'Leelawadee UI', 'Segoe UI', sans-serif;
      }

      .nam-initial-splash-card {
        display: flex;
        width: min(420px, calc(100vw - 48px));
        flex-direction: column;
        align-items: center;
        border: 1px solid rgba(96, 165, 250, 0.2);
        border-radius: 18px;
        background: rgba(13, 21, 38, 0.92);
        padding: 36px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.36);
        text-align: center;
      }

      .nam-initial-splash-card img {
        width: 92px;
        height: 92px;
        object-fit: contain;
        filter: drop-shadow(0 18px 34px rgba(59, 130, 246, 0.3));
      }

      .nam-initial-splash-card h1 {
        margin: 24px 0 8px;
        color: #ffffff;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .nam-initial-splash-card p {
        margin: 0;
        color: #94a3b8;
        font-size: 13px;
        font-weight: 700;
      }

      .nam-initial-splash-bar {
        position: relative;
        width: 100%;
        height: 8px;
        margin-top: 26px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
      }

      .nam-initial-splash-bar::after {
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        animation: nam-initial-splash-load 1.15s ease-in-out infinite;
        content: '';
      }

      @keyframes nam-initial-splash-load {
        from {
          transform: translateX(-120%);
        }

        to {
          transform: translateX(240%);
        }
      }
    </style>
    <script type="module" src="/runtime-globals.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="nam-initial-splash" role="status" aria-live="polite">
        <section class="nam-initial-splash-card" aria-label="NamLauncher loading">
          <img src="./namlauncher-icon.png" alt="" />
          <h1>NamLauncher</h1>
          <p>กำลังเปิด NamLauncher...</p>
          <div class="nam-initial-splash-bar" aria-hidden="true"></div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
